<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Console — ping smokinglopez.com</title>

  <!-- Favicon: globo terráqueo estilo hacker (inline SVG data URL) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20fill='%23020201'/%3E%3Cg%20stroke='%2358ff7a'%20stroke-width='4'%20fill='none'%3E%3Ccircle%20cx='50'%20cy='50'%20r='30'/%3E%3Cpath%20d='M10%2050h80'/%3E%3Cpath%20d='M50%2010v80'/%3E%3Cpath%20d='M30%2020%20C40%2050%2040%2050%2030%2080'/%3E%3Cpath%20d='M70%2020%20C60%2050%2060%2050%2070%2080'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="shortcut icon" href="data:image/svg+xml;utf8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20fill='%23020201'/%3E%3Cg%20stroke='%2358ff7a'%20stroke-width='4'%20fill='none'%3E%3Ccircle%20cx='50'%20cy='50'%20r='30'/%3E%3Cpath%20d='M10%2050h80'/%3E%3Cpath%20d='M50%2010v80'/%3E%3Cpath%20d='M30%2020%20C40%2050%2040%2050%2030%2080'/%3E%3Cpath%20d='M70%2020%20C60%2050%2060%2050%2070%2080'/%3E%3C/g%3E%3C/svg%3E">

  <style>
    :root{ --bg:#020201; --text:#9aff8f; --muted:#3a5b3a; --accent:#58ff7a }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      background: radial-gradient(circle at 10% 10%, rgba(0,0,0,0.6), #000 40%);
      color:var(--text);
      font-family: "Courier New", Courier, monospace;
      display:flex;align-items:center;justify-content:center;
      -webkit-font-smoothing:antialiased;
    }

    .screen{
      width:min(980px,94vw);
      height:min(640px,76vh);
      background: linear-gradient(180deg, rgba(0,0,0,0.85), rgba(0,0,0,0.95));
      border:1px solid rgba(90,255,120,0.05);
      padding:1.2rem;
      border-radius:8px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
      position:relative;
      overflow:auto;
    }

    /* subtle scanlines */
    .screen::after{
      content:"";position:absolute;left:0;right:0;top:0;bottom:0;
      background:repeating-linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0) 3px, rgba(0,0,0,0.06) 4px);
      pointer-events:none;mix-blend-mode:overlay;border-radius:8px;
    }

    .title{font-size:0.86rem;color:var(--muted);margin-bottom:0.6rem}

    pre.console{
      margin:0;font-family:inherit;font-size:1rem;line-height:1.45;white-space:pre-wrap;
    }

    .cursor{display:inline-block;width:8px;height:18px;background:var(--text);margin-left:4px;vertical-align:bottom;animation:blink 1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}

    .green{color:var(--text)}
    .muted{color:var(--muted)}
    .accent{color:var(--accent)}

    /* typing selection look */
    .bar{height:6px;border-radius:4px;background:linear-gradient(90deg, rgba(88,255,122,0.08), rgba(88,255,122,0.02));margin:8px 0}

    .status-ok{color:#6eff9a;font-weight:700}
    .status-fail{color:#ff6b6b;font-weight:700}

    footer.note{margin-top:12px;font-size:0.78rem;color:var(--muted)}

  </style>
</head>
<body>
  <div class="screen" role="main" aria-live="polite">
    <div class="title">Local host &gt; <span class="muted">Shell/span></div>

    <pre class="console" id="console"></pre>

  <script>
    const out = document.getElementById('console');
    const restart = document.getElementById('restart');

    // Simulación de typing y salida de ping
    const command = 'ping smokinglopez.com';

    const simulatedIP = '93.184.216.34'; // ejemplo

    const pingLines = [
      `PING smokinglopez.com (${simulatedIP}): 56 data bytes`,
      `64 bytes from ${simulatedIP}: icmp_seq=1 ttl=54 time=${(Math.random()*40+10).toFixed(1)} ms`,
      `64 bytes from ${simulatedIP}: icmp_seq=2 ttl=54 time=${(Math.random()*40+10).toFixed(1)} ms`,
      `64 bytes from ${simulatedIP}: icmp_seq=3 ttl=54 time=${(Math.random()*40+10).toFixed(1)} ms`,
      `64 bytes from ${simulatedIP}: icmp_seq=4 ttl=54 time=${(Math.random()*40+10).toFixed(1)} ms`,
      `--- ${'smokinglopez.com'} ping statistics ---`,
      `4 packets transmitted, 4 packets received, 0.0% packet loss`,
      `round-trip min/avg/max = 12.3/27.8/46.9 ms`
    ];

    function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

    function append(text, cls){
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = text + '\n';
      out.appendChild(span);
      out.parentElement.scrollTop = out.parentElement.scrollHeight;
    }

    async function typeLine(line, speed=50){
      const lineEl = document.createElement('span');
      lineEl.className = 'green';
      out.appendChild(lineEl);
      for (let i=0;i<line.length;i++){
        lineEl.textContent += line[i];
        out.parentElement.scrollTop = out.parentElement.scrollHeight;
        await sleep(speed + Math.random()*40);
      }
      lineEl.textContent += '\n';
      return;
    }

    async function runSequence(){
      out.innerHTML = '';
      // prompt and type command
      await typeLine('user@local:~$ ' + command, 40);
      // small pause
      await sleep(450);

      // show header
      append('\n', '');
      for (let i=0;i<pingLines.length;i++){
        // recalc times for lines that have time
        if (pingLines[i].includes('time=')){
          const time = (Math.random()*40+5).toFixed(1);
          const line = `64 bytes from ${simulatedIP}: icmp_seq=${i} ttl=54 time=${time} ms`;
          append(line, 'green');
        } else if (pingLines[i].includes('round-trip')){
          const min = (Math.random()*5+6).toFixed(1);
          const max = (Math.random()*60+30).toFixed(1);
          const avg = (Number(min)+Number(max))/2;
          append(`round-trip min/avg/max = ${min}/${avg.toFixed(1)}/${max} ms`, 'muted');
        } else if (pingLines[i].includes('ping statistics')){
          append(pingLines[i], 'muted');
        } else if (pingLines[i].includes('packets transmitted')){
          append(pingLines[i], 'muted');
        } else {
          append(pingLines[i], 'green');
        }
        // visual pulse effect based on whether it's a reply
        if (pingLines[i].startsWith('64 bytes')) {
          document.documentElement.style.setProperty('--pulse', '1');
          flashScreen();
        }
        await sleep(600 + Math.random()*600);
      }

      // final status
      append('\n', '');
      append('STATUS: ', 'muted');
      const statusEl = document.createElement('span');
      statusEl.className = 'status-ok';
      statusEl.textContent = 'successful — connected to smokinglopez.com';
      out.appendChild(statusEl);
      append('\n\n', '');
    }

    function flashScreen(){
      const screen = document.querySelector('.screen');
      screen.style.boxShadow = '0 0 60px rgba(88,255,122,0.12)';
      setTimeout(()=>{screen.style.boxShadow = ''},180);
    }

    restart.addEventListener('click', runSequence);

    // start on load
    runSequence();

  </script>
</body>
</html>
