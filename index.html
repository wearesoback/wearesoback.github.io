<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Welcome — Drive Aesthetic</title>

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Condensed:wght@300;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#0b0b10;
      --neon-pink: #ff2d95;
      --neon-cyan: #00e5ff;
      --muted:#bfc7d4;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background: radial-gradient(ellipse at center, rgba(255,45,149,0.04) 0%, rgba(0,229,255,0.02) 30%, transparent 40%), linear-gradient(180deg, #060608 0%, var(--bg) 100%);
      color:var(--muted);
      font-family: 'Roboto Condensed', system-ui, -apple-system, "Segoe UI", Roboto, 'Helvetica Neue', Arial;
      display:flex;
      align-items:center;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .card{
      width:min(880px, 92vw);
      padding:3.5rem 2.5rem;
      border-radius:18px;
      text-align:center;
      position:relative;
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: 0 10px 40px rgba(2,6,23,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
      backdrop-filter: blur(6px) saturate(120%);
    }

    /* Neon grid lines (subtle) */
    .card::before{
      content:"";
      position:absolute;left:0;right:0;top:0;bottom:0;
      background-image: linear-gradient(transparent 78%, rgba(0,229,255,0.02) 79%), linear-gradient(90deg, transparent 78%, rgba(255,45,149,0.02) 79%);
      pointer-events:none;
      mix-blend-mode:overlay;
    }

    h1{
      margin:0 0 0.5rem 0;
      font-family: 'Orbitron', sans-serif;
      font-weight:700;
      letter-spacing:0.12em;
      font-size:clamp(2.2rem, 6vw, 4rem);
      color:var(--neon-pink);
      text-transform:uppercase;
      text-shadow: 0 0 18px rgba(255,45,149,0.45), 0 0 40px rgba(0,229,255,0.06);
      transform:translateY(-6px);
    }

    .sub{
      font-size:clamp(0.9rem,1.8vw,1.1rem);
      color:var(--neon-cyan);
      font-weight:700;
      margin-bottom:1.4rem;
      text-shadow: 0 0 10px rgba(0,229,255,0.18);
    }

    .glow-line{
      width:160px;height:6px;margin:1.2rem auto 2rem auto;border-radius:999px;
      background:linear-gradient(90deg, rgba(255,45,149,0.9), rgba(0,229,255,0.9));
      filter:blur(6px);
      opacity:0.9;
      box-shadow:0 6px 30px rgba(255,45,149,0.12), 0 10px 40px rgba(0,229,255,0.10);
    }

    p.lead{
      margin:0 auto;
      max-width:54ch;
      color:rgba(191,199,212,0.9);
      line-height:1.6;
      font-size:1rem;
    }

    /* Retro car silhouette (SVG) */
    .car{
      display:block;margin:1.8rem auto 0 auto;opacity:0.9;max-width:460px;width:85%;
      filter: drop-shadow(0 12px 30px rgba(0,0,0,0.6));
      transform:translateY(6px);
    }

    /* small pulse effect */
    @keyframes pulseNeon{
      0%{transform:scale(1)}
      50%{transform:scale(1.02)}
      100%{transform:scale(1)}
    }
    .card{animation:pulseNeon 6s ease-in-out infinite}

    /* Footer small */
    .credit{font-size:0.75rem;color:rgba(191,199,212,0.55);margin-top:1.6rem}

    /* Dark mode friendliness - it's already dark */
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Welcome</h1>
    <div class="sub">Just a casual ride</div>
    <div class="glow-line" aria-hidden="true"></div>
  </main>
</body>
</html>
